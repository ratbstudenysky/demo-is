<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost&Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--bg2:#E9ECF4;--surf:#fff;--glass:rgba(255,255,255,.68);--tx:#171B24;--mu:#858C99;--bd:rgba(255,255,255,.85);--ln:rgba(35,45,65,.1);--shc:rgba(35,45,65,.08);--sh:0 8px 28px var(--shc);--pri:#20242D;--pt:#fff;--inp:rgba(255,255,255,.75);
--lost-b:#E8F1FF;--lost-t:#2769C8;--found-b:#E7F7EF;--found-t:#238557;--rev-b:#FFF4DB;--rev-t:#A87516;--ret-b:#EEF0F3;--ret-t:#687080;--dng:#E45B5B;color-scheme:light}
:root[data-theme=dark]{--bg:#0E1116;--bg2:#1A1F2A;--surf:#1B2029;--glass:rgba(40,46,58,.62);--tx:#F2F4F8;--mu:#99A1B0;--bd:rgba(255,255,255,.12);--ln:rgba(255,255,255,.1);--shc:rgba(0,0,0,.4);--sh:0 8px 28px var(--shc);--pri:#F2F4F8;--pt:#14171D;--inp:rgba(255,255,255,.07);
--lost-b:#1B2E4D;--lost-t:#8DB8FF;--found-b:#173A2B;--found-t:#7FDDAE;--rev-b:#41331A;--rev-t:#F0C373;--ret-b:#2A2F3A;--ret-t:#AAB1BE;color-scheme:dark}
html{transition:--bg .55s ease,--bg2 .55s ease,--surf .55s ease,--glass .55s ease,--tx .55s ease,--mu .55s ease,--bd .55s ease,--ln .55s ease,--shc .55s ease,--pri .55s ease,--pt .55s ease,--inp .55s ease,--lost-b .55s ease,--lost-t .55s ease,--found-b .55s ease,--found-t .55s ease,--rev-b .55s ease,--rev-t .55s ease,--ret-b .55s ease,--ret-t .55s ease}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans Thai',-apple-system,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg2);color:var(--tx);font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);isolation:isolate}
@supports(height:100dvh){.phone{height:100dvh}}
@media(min-width:500px){.phone{width:390px;height:844px;max-height:96vh;border-radius:48px;box-shadow:0 30px 80px rgba(35,45,65,.22),0 0 0 8px var(--surf)}}
.phone:before,.phone:after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(2px);pointer-events:none}
.phone:before{width:420px;height:420px;right:-180px;top:-120px;background:radial-gradient(circle,var(--surf),transparent 70%)}
.phone:after{width:380px;height:380px;left:-200px;bottom:60px;background:radial-gradient(circle,var(--bg2),transparent 70%)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .35s ease}
@keyframes in{from{opacity:0}}
.scr.in-r{animation:inr .42s cubic-bezier(.2,.8,.2,1)}.scr.in-l{animation:inl .42s cubic-bezier(.2,.8,.2,1)}
.scr.out-l{animation:outl .3s ease forwards}.scr.out-r{animation:outr .3s ease forwards}
@keyframes inr{from{opacity:0;transform:translateX(44px)}}@keyframes inl{from{opacity:0;transform:translateX(-44px)}}
@keyframes outl{to{opacity:0;transform:translateX(-44px)}}@keyframes outr{to{opacity:0;transform:translateX(44px)}}
.lang-out{opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}
.scr.lang-in,.lang-in{animation:lin .4s ease}@keyframes lin{from{opacity:0;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scr.out-l,.scr.out-r{display:none}}
.body{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 24px;scrollbar-width:none}
.body.nav{padding-bottom:120px}.body::-webkit-scrollbar{display:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:24px}
h1{font-size:26px;font-weight:700;line-height:1.3}h2{font-size:20px;font-weight:600}h3{font-size:17px;font-weight:600}
.mu{color:var(--mu)}.cap{font-size:13px;color:var(--mu)}.c{text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:12px}
.top h3{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1}
.btn{height:54px;border-radius:18px;background:var(--pri);color:var(--pt);font-weight:600;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px rgba(20,25,40,.2);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn.sec{background:var(--glass);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn.out{background:transparent;color:var(--dng);border:1px solid var(--ln);box-shadow:none}
.fld{margin-bottom:14px}.fld label{display:block;font-size:13px;font-weight:500;margin:0 0 6px 4px}
.fld .w{display:flex;align-items:center;gap:10px;background:var(--inp);border:1px solid var(--ln);border-radius:16px;padding:0 14px;min-height:50px;color:var(--mu);transition:border-color .2s,box-shadow .2s}
.fld .w:focus-within{border-color:#3478F6;box-shadow:0 0 0 3px rgba(52,120,246,.18)}
.fld.err .w{border-color:var(--dng)}.fld .em{color:var(--dng);font-size:12px;margin:4px 0 0 4px;display:none}.fld.err .em{display:block}
.fld input,.fld select,.fld textarea{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);padding:12px 0;font-size:15px}
.fld textarea{resize:none;min-height:76px}.fld select option{color:#000}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-lost{background:var(--lost-b);color:var(--lost-t)}.b-found{background:var(--found-b);color:var(--found-t)}.b-review{background:var(--rev-b);color:var(--rev-t)}.b-returned{background:var(--ret-b);color:var(--ret-t)}
.row{display:flex;align-items:center;gap:14px}.g{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:12px;width:100%;text-align:left}
.thumb{width:62px;height:62px;border-radius:16px;background:linear-gradient(145deg,var(--surf),var(--bg2));display:grid;place-items:center;flex:none;border:1px solid var(--bd);box-shadow:inset 0 1px 6px rgba(255,255,255,.5)}
.thumb{overflow:hidden}.thumb svg{width:30px;height:30px}.thumb.lg{width:100%;height:230px;border-radius:28px}.thumb.lg svg{width:96px;height:96px;stroke-width:1.2}
.nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{}
.bar{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;padding:8px;border-radius:32px;z-index:5;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.bar.hide{transform:translateY(140%);opacity:0;pointer-events:none}
.bar .pill{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 16px)/3);border-radius:24px;background:var(--ln);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.3,1.25,.45,1)}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;color:var(--mu);font-size:12px;position:relative;min-height:56px;transition:color .3s}
.bar button svg{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.bar button.on{color:var(--tx);font-weight:600}.bar button.on svg{transform:translateY(-1px) scale(1.12)}
.bar button:after{content:"";position:absolute;bottom:1px;width:36px;height:3px;border-radius:3px;background:var(--tx);opacity:0;transition:opacity .3s}.bar button.on:after{opacity:1}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 26px}
.logo{width:150px;height:150px;border-radius:40px;display:grid;place-items:center;transform:rotate(-8deg);margin:10px 0 26px;position:relative}
.logo.s{width:96px;height:96px;border-radius:28px;margin:6px 0 16px}
.logo svg{width:74%;height:74%;transform:rotate(8deg)}
.logo:before{content:"";position:absolute;inset:-14px -34px;border:1px solid var(--ln);border-radius:50%;transform:rotate(14deg)}
.logo.s:before{display:none}
.hero h1{font-size:32px}
.sc{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:12px;width:100%;text-align:left;border-radius:28px}
.sc .ic{padding-right:16px;border-right:1px solid var(--ln)}.sc .ic svg{width:30px;height:30px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.seg{display:flex;background:var(--inp);border:1px solid var(--ln);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:12px;font-weight:500;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.seg button.on{background:var(--pri);color:var(--pt)}
.chips{display:flex;gap:8px;margin:12px 0 16px;overflow-x:auto;scrollbar-width:none}
.chip{padding:8px 18px;border-radius:99px;background:var(--inp);border:1px solid var(--ln);white-space:nowrap;min-height:40px}
.chip.on{background:var(--pri);color:var(--pt);border-color:transparent}
.upl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px;text-align:center;cursor:pointer;margin-bottom:16px;overflow:hidden}
.upl img{width:100%;max-height:180px;object-fit:cover;border-radius:16px}
.list{overflow:hidden;margin-bottom:16px}
.list button,.list .li{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;text-align:left;min-height:54px}
.list>*+*{border-top:1px solid var(--ln)}
.cnt{margin-left:auto;background:var(--dng);color:#fff;border-radius:99px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;font-weight:600}
.sw{width:50px;height:30px;border-radius:30px;background:var(--ln);position:relative;margin-left:auto;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:#2EAA72}.sw.on:after{left:23px}
.av{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,var(--surf),var(--bg2));display:grid;place-items:center;margin:8px auto 14px;border:1px solid var(--bd);box-shadow:var(--sh)}.av svg{width:48px;height:48px;color:var(--mu)}
.msgs{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:78%;padding:10px 14px;border-radius:20px;font-size:15px}.m small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.m.me{align-self:flex-end;background:var(--lost-b);color:var(--lost-t);border-bottom-right-radius:6px}.m.th{align-self:flex-start;background:var(--ret-b);border-bottom-left-radius:6px}
.cb{display:flex;gap:10px;align-items:center;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 16px)}
.cb input{flex:1;height:46px;border-radius:23px;border:1px solid var(--ln);background:var(--inp);padding:0 18px;outline:0;color:var(--tx)}
.cb .snd{width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--pt);display:grid;place-items:center}
.nt{display:flex;gap:14px;padding:14px;margin-bottom:12px;align-items:flex-start}
.nt .d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}.empty svg{width:56px;height:56px;margin-bottom:10px;opacity:.6}
.sheet{position:absolute;inset:0;z-index:20;background:rgba(10,14,22,.35);display:flex;align-items:flex-end;animation:in .2s}
.sheet>div{width:100%;padding:26px 24px calc(env(safe-area-inset-bottom,0px) + 24px);border-radius:32px 32px 0 0;background:var(--surf);animation:up .3s ease}
@keyframes up{from{transform:translateY(40px)}}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:30;padding:12px 20px;border-radius:99px;font-weight:500;white-space:nowrap;animation:in .25s}
.spin{width:26px;height:26px;border:3px solid var(--ln);border-top-color:var(--tx);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}@keyframes sp{to{transform:rotate(360deg)}}
a.l{color:#3478F6;font-weight:500;cursor:pointer;text-decoration:none}
.info{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}.info svg{margin-top:2px;color:var(--mu)}
:focus-visible{outline:2px solid #3478F6;outline-offset:2px}
</style>
</head>

const TABS=['home','items','profile'];let prev='home';
function syncNav(mode){const a=document.getElementById('app'),i=TABS.indexOf(S.scr);let n=a.querySelector('.bar');
if(!n){a.insertAdjacentHTML('beforeend',`<nav class="bar glass hide" style="--i:${Math.max(i,0)}"><i class="pill"></i>${TABS.map((k,j)=>`<button data-go="${k}">${ic(['home','list','user'][j])}<span></span></button>`).join('')}</nav>`);n=a.querySelector('.bar');n.offsetWidth}
if(i>=0)n.style.setProperty('--i',i);n.classList.toggle('hide',i<0);
n.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('on',j==i);b.setAttribute('aria-label',t(TABS[j]));const sp=b.querySelector('span');sp.textContent=t(TABS[j]);if(mode=='lang'){sp.classList.remove('lang-out');sp.classList.add('lang-in');setTimeout(()=>sp.classList.remove('lang-in'),450)}})}
function draw(keep,mode){const a=document.getElementById('app'),olds=[...a.querySelectorAll('.scr')],cur=olds.filter(x=>!x.dataset.out).pop();
const sc=cur?.querySelector('.body')?.scrollTop||0,el=document.createElement('div');el.className='scr';el.innerHTML=V[S.scr]();
if(keep&&!mode)el.style.animation='none';
if(mode=='r'||mode=='l'){el.classList.add('in-'+mode);olds.filter(x=>x!==cur).forEach(x=>x.remove());if(cur){cur.dataset.out=1;cur.classList.add('out-'+(mode=='r'?'l':'r'));cur.style.pointerEvents='none';setTimeout(()=>cur.remove(),340)}}
else{olds.forEach(x=>x.remove());if(mode=='lang'){el.classList.add('lang-in');setTimeout(()=>el.classList.remove('lang-in'),450)}}
a.insertBefore(el,a.querySelector('.bar'));
const b=el.querySelector('.body');if(b&&keep)b.scrollTop=sc;
const ms=el.querySelector('#ms');if(ms)ms.scrollTop=ms.scrollHeight;
syncNav(mode);
if(S.scr=='splash')setTimeout(()=>{if(S.scr=='splash')go('login')},1400)}
function setLang(v){if(v==S.lang)return;const a=document.getElementById('app'),sc=[...a.querySelectorAll('.scr')].pop();sc&&sc.classList.add('lang-out');a.querySelectorAll('.bar span').forEach(x=>x.classList.add('lang-out'));
setTimeout(()=>{S.lang=v;save();applyTheme();draw(1,'lang')},190)}
function setTheme(v){if(v==S.theme)return;S.theme=v;save();applyTheme()}
function go(s){if(s=='back')s=prev;if(s=='settings')prev=S.scr=='settings'?prev:S.scr;if(s=='chat'&&!S.msgs.length)S.msgs=[{me:1,x:t('hello'),t:'09:42'},{me:0,x:t('reply'),t:'09:43'}];
const a=TABS.indexOf(S.scr),b=TABS.indexOf(s),dir=a>=0&&b>=0&&a!=b?(b>a?'r':'l'):null;S.errs={};S.sheet=false;S.scr=s;draw(a>=0&&a==b?1:0,dir)}
function toast(x){const e=document.createElement('div');e.className='toast glass';e.textContent=x;document.getElementById('app').appendChild(e);setTimeout(()=>e.remove(),2400)}
function val(){const g=id=>document.getElementById(id)?.value.trim();S.draft={n:g('n'),d:g('d'),c:g('c'),p:g('p'),dt:g('dt')};S.errs={n:!S.draft.n,c:!S.draft.c,p:!S.draft.p,dt:!S.draft.dt};return!Object.values(S.errs).some(Boolean)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-open],[data-new],[data-type],[data-f],[data-act],[data-set],[data-tg]');if(!el)return;const d=el.dataset;
if(d.go){if(d.go=='profile'||d.go=='home'||(d.go=='items'&&el.closest('.bar')))S.mine=false;go(d.go)}
else if(d.open){S.sel=+d.open;go('detail')}
else if(d.new){S.type=d.new;S.pv=null;go('report')}
else if(d.type){val();S.type=d.type;const dr=S.draft;S.errs={};draw(1);['n','d','p','dt'].forEach(k=>{const x=document.getElementById(k);if(x)x.value=dr[k]||''});const c=document.getElementById('c');if(c)c.value=dr.c||''}
else if(d.f){S.f=d.f;draw(1)}
else if(d.set){const[k,v]=d.set.split(':');el.parentElement.querySelectorAll('button').forEach(b=>{const on=b===el;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});k=='theme'?setTheme(v):setLang(v)}
else if(d.tg){S[d.tg]=!S[d.tg];draw(1)}
else{const a=d.act;if(a=='close'&&el.classList.contains('sheet')&&e.target!==el)return;
if(a=='soon')toast(t('soon'));
else if(a=='eye'){const i=el.parentElement.querySelector('input');i.type=i.type=='password'?'text':'password'}
else if(a=='clr'){S.q='';S.f='all';S.mine=false;draw()}
else if(a=='mine'){S.mine=true;S.f='all';S.q='';prev='mine';go('items')}
else if(a=='submit'){if(val()){S.sheet=true}draw(1);const dr=S.draft;['n','d','p','dt'].forEach(k=>{const x=document.getElementById(k);if(x)x.value=dr[k]||''});const c=document.getElementById('c');if(c)c.value=dr.c||''}
else if(a=='close'){S.sheet=false;const dr=S.draft;draw(1);['n','d','p','dt'].forEach(k=>{const x=document.getElementById(k);if(x)x.value=dr[k]||''});const c=document.getElementById('c');if(c)c.value=dr.c||''}
else if(a=='publish'){const dr=S.draft;S.items.unshift({id:Date.now(),k:'i1',ic:{cEl:'phones',cBag:'bag',cBot:'bottle',cAcc:'umb',cDoc:'card'}[dr.c]||'box',ty:S.type,s:'review',d:dr.dt+'T'+new Date().toTimeString().slice(0,5),mine:1,custom:{n:dr.n,d:dr.d,p:dr.p,img:S.pv}});S.pv=null;S.draft=null;S.sheet=false;S.f='all';S.mine=false;go('items');toast(t('sent'))}
else if(a=='send'){const i=document.getElementById('cm');if(!i.value.trim())return;S.msgs.push({me:1,x:i.value.trim(),t:new Date().toTimeString().slice(0,5)});draw(1);document.getElementById('cm').focus();setTimeout(()=>{S.msgs.push({me:0,x:'👍',t:new Date().toTimeString().slice(0,5)});if(S.scr=='chat')draw(1)},900)}}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;document.getElementById('ls').innerHTML=listHtml()}});
document.addEventListener('change',e=>{if(e.target.id=='ph'&&e.target.files[0]){val();const dr=S.draft;S.pv=URL.createObjectURL(e.target.files[0]);draw(1);['n','d','p','dt'].forEach(k=>{const x=document.getElementById(k);if(x)x.value=dr[k]||''});const c=document.getElementById('c');if(c)c.value=dr.c||''}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='cm')document.querySelector('[data-act=send]').click()});
applyTheme();draw();
</script>
</body>
</html>
